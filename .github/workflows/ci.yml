name: ci
on: [push, pull_request]

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # the native modules are sibling checkouts (modules.conf, EXT=..)
      - name: fetch module sources
        run: |
          git clone https://github.com/lunarmodules/luafilesystem ../luafilesystem && git -C ../luafilesystem checkout -q 146ab458e821cd7617892099fe8e6e399b46185c
          git clone https://github.com/mpx/lua-cjson ../lua-cjson && git -C ../lua-cjson checkout -q 718f27293a981fb5e9e662e9aec0b7cf78317da6
          git clone --depth 1 https://github.com/tibocub/vaporUI ../vaporUI
          git clone https://github.com/tibocub/lua-ed25519 ../ed25519 && git -C ../ed25519 checkout -q v0.1
          git clone https://www.bearssl.org/git/BearSSL ../BearSSL && git -C ../BearSSL checkout -q 7bea48e5e850ab4cafbe68d3765cdaba13a86d6f
          curl -fsSL https://www.inf.puc-rio.br/~roberto/lpeg/lpeg-1.1.0.tar.gz | tar -xz -C ..
      - run: make vlr
      - run: make test
      - run: make check
        if: runner.os == 'Linux'

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc git curl tar
      - name: fetch module sources
        run: |
          git clone https://github.com/lunarmodules/luafilesystem ../luafilesystem && git -C ../luafilesystem checkout -q 146ab458e821cd7617892099fe8e6e399b46185c
          git clone https://github.com/mpx/lua-cjson ../lua-cjson && git -C ../lua-cjson checkout -q 718f27293a981fb5e9e662e9aec0b7cf78317da6
          git clone --depth 1 https://github.com/tibocub/vaporUI ../vaporUI
          git clone https://github.com/tibocub/lua-ed25519 ../ed25519 && git -C ../ed25519 checkout -q v0.1
          git clone https://www.bearssl.org/git/BearSSL ../BearSSL && git -C ../BearSSL checkout -q 7bea48e5e850ab4cafbe68d3765cdaba13a86d6f
          curl -fsSL https://www.inf.puc-rio.br/~roberto/lpeg/lpeg-1.1.0.tar.gz | tar -xz -C ..
      - run: make TARGET=win32 CC=gcc
      - run: VLR=./vlr.exe sh tests/run.sh

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: fetch module sources
        run: |
          git clone https://github.com/lunarmodules/luafilesystem ../luafilesystem && git -C ../luafilesystem checkout -q 146ab458e821cd7617892099fe8e6e399b46185c
          git clone https://github.com/mpx/lua-cjson ../lua-cjson && git -C ../lua-cjson checkout -q 718f27293a981fb5e9e662e9aec0b7cf78317da6
          git clone --depth 1 https://github.com/tibocub/vaporUI ../vaporUI
          git clone https://github.com/tibocub/lua-ed25519 ../ed25519 && git -C ../ed25519 checkout -q v0.1
          git clone https://www.bearssl.org/git/BearSSL ../BearSSL && git -C ../BearSSL checkout -q 7bea48e5e850ab4cafbe68d3765cdaba13a86d6f
          curl -fsSL https://www.inf.puc-rio.br/~roberto/lpeg/lpeg-1.1.0.tar.gz | tar -xz -C ..
      - run: make TARGET=web web/vlr.js
      - run: VLR="node --liftoff-only web/run.mjs" sh tests/run.sh
      - run: node --liftoff-only web/ui-test.mjs
      - name: build the demo site
        run: |
          curl -fsSL https://bun.sh/install | bash && export PATH="$HOME/.bun/bin:$PATH"
          sh web/build.sh && sh web/pack.sh "$PWD/site"
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: wasm
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
