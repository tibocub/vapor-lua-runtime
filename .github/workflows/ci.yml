name: ci
on: [push, pull_request]

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # the native modules are sibling checkouts (modules.conf, EXT=..)
      - name: fetch module sources
        run: |
          git clone https://github.com/lunarmodules/luafilesystem ../luafilesystem && git -C ../luafilesystem checkout -q 146ab458e821cd7617892099fe8e6e399b46185c
          git clone https://github.com/mpx/lua-cjson ../lua-cjson && git -C ../lua-cjson checkout -q 718f27293a981fb5e9e662e9aec0b7cf78317da6
          curl -fsSL https://www.inf.puc-rio.br/~roberto/lpeg/lpeg-1.1.0.tar.gz | tar -xz -C ..
      - run: make vlr
      - run: make test
      - run: make check
        if: runner.os == 'Linux'

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc git curl tar
      - name: fetch module sources
        run: |
          git clone https://github.com/lunarmodules/luafilesystem ../luafilesystem && git -C ../luafilesystem checkout -q 146ab458e821cd7617892099fe8e6e399b46185c
          git clone https://github.com/mpx/lua-cjson ../lua-cjson && git -C ../lua-cjson checkout -q 718f27293a981fb5e9e662e9aec0b7cf78317da6
          curl -fsSL https://www.inf.puc-rio.br/~roberto/lpeg/lpeg-1.1.0.tar.gz | tar -xz -C ..
      - run: make TARGET=win32 CC=gcc
      - run: VLR=./vlr.exe sh tests/run.sh

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: fetch module sources
        run: |
          git clone https://github.com/lunarmodules/luafilesystem ../luafilesystem && git -C ../luafilesystem checkout -q 146ab458e821cd7617892099fe8e6e399b46185c
          git clone https://github.com/mpx/lua-cjson ../lua-cjson && git -C ../lua-cjson checkout -q 718f27293a981fb5e9e662e9aec0b7cf78317da6
          curl -fsSL https://www.inf.puc-rio.br/~roberto/lpeg/lpeg-1.1.0.tar.gz | tar -xz -C ..
      - run: make TARGET=web web/vlr.js
      - run: VLR="node web/run.mjs" sh tests/run.sh
      - run: node web/ev-test.mjs
