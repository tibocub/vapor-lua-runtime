# Native modules compiled into the runtime and registered in package.preload.
# name  luaopen_symbol  sources and -D flags; @EXT@ is the folder holding the sibling checkouts (make EXT=..)
# in-tree modules: the optional parts of the vapor API (@VLR@ = the folder of this file)
vapor.fs    luaopen_vapor_fs    @VLR@/src/mod_fs.c
# the terminal decoder is vaporUI's (sibling checkout @EXT@/vaporUI)
vapor.term  luaopen_vapor_term  @VLR@/src/mod_term.c @VLR@/src/term_vt.c posix:@EXT@/vaporUI/src/vtraw.c @EXT@/vaporUI/src/input.c @EXT@/vaporUI/src/vt.c @EXT@/vaporUI/src/utf8.c @EXT@/vaporUI/src/scancode.c @EXT@/vaporUI/src/winkeys.c -I@EXT@/vaporUI/src -I@EXT@/vaporUI/include
vapor.ui  luaopen_vapor_ui  @VLR@/src/mod_ui.c @EXT@/vaporUI/src/screen.c @EXT@/vaporUI/src/utf8.c -I@EXT@/vaporUI/src -I@EXT@/vaporUI/include
vapor.input lua:@VLR@/lua/input.lua
vapor.manifest lua:@VLR@/lua/manifest.lua
vapor.repl lua:@VLR@/lua/repl.lua
vapor.stream lua:@VLR@/lua/stream.lua
vapor.netraw luaopen_vapor_netraw @VLR@/src/mod_netraw.c @VLR@/src/net_@PLAT@.c
vapor.net lua:@VLR@/lua/net.lua
# TLS client: engine (BearSSL, sibling checkout; src/*/*.c are expanded by tools/modsrc.sh) + the Lua side
vapor.tlsraw luaopen_vapor_tlsraw @VLR@/src/mod_tlsraw.c @EXT@/BearSSL/src/*/*.c @EXT@/BearSSL/src/settings.c -I@EXT@/BearSSL/inc -I@EXT@/BearSSL/src
vapor.tls lua:@VLR@/lua/tls.lua
vapor.cacerts lua:@VLR@/lua/cacerts.lua
# std: optional pure-Lua batteries
std.http lua:@VLR@/lua/http.lua
std.httpd lua:@VLR@/lua/httpd.lua
socket lua:@VLR@/lua/socket.lua
std.socket lua:@VLR@/lua/std_socket.lua
# ed25519 verification for vpm's signed index (Monocypher is a sibling checkout)
vapor.sign luaopen_vapor_sign @VLR@/src/mod_sign.c @EXT@/Monocypher/src/monocypher.c @EXT@/Monocypher/src/optional/monocypher-ed25519.c -I@EXT@/Monocypher/src -I@EXT@/Monocypher/src/optional
# third-party C modules
lfs   luaopen_lfs   @EXT@/luafilesystem/src/lfs.c
lpeg  luaopen_lpeg  @EXT@/lpeg-1.1.0/lpcap.c @EXT@/lpeg-1.1.0/lpcode.c @EXT@/lpeg-1.1.0/lpcset.c @EXT@/lpeg-1.1.0/lpprint.c @EXT@/lpeg-1.1.0/lptree.c @EXT@/lpeg-1.1.0/lpvm.c
cjson luaopen_cjson @EXT@/lua-cjson/lua_cjson.c @EXT@/lua-cjson/strbuf.c @EXT@/lua-cjson/fpconv.c
