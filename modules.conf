# Native modules compiled into the runtime and registered in package.preload.
# name  luaopen_symbol  sources and -D flags; @EXT@ is the folder holding the sibling checkouts (make EXT=..)
# in-tree modules: vlr internals (require("vlr") and vlr.*), not meant for programs (@VLR@ = the folder of this file)
# vaporUI's Lua binding (sibling checkout @EXT@/vaporUI): terminal events and the cell screen, on its own platform layer
vaporui luaopen_vaporui @EXT@/vaporUI/bindings/lua/src/lvaporui.c @EXT@/vaporUI/src/screen.c @EXT@/vaporUI/src/utf8.c @EXT@/vaporUI/src/input.c @EXT@/vaporUI/src/vt.c @EXT@/vaporUI/src/scancode.c @EXT@/vaporUI/src/keys.c @EXT@/vaporUI/src/vtraw.c @EXT@/vaporUI/src/clipboard.c @EXT@/vaporUI/src/gpm.c @EXT@/vaporUI/src/winkeys.c @EXT@/vaporUI/src/platform/@PLAT@.c -I@EXT@/vaporUI/src -I@EXT@/vaporUI/include
vlr.repl lua:@VLR@/lua/repl.lua
vlr.stream lua:@VLR@/lua/stream.lua
vlr.netraw luaopen_vlr_netraw @VLR@/src/mod_netraw.c @VLR@/src/net_@PLAT@.c
vlr.net lua:@VLR@/lua/net.lua
# TLS client: engine (BearSSL, sibling checkout; src/*/*.c are expanded by tools/modsrc.sh) + the Lua side
vlr.tlsraw luaopen_vlr_tlsraw @VLR@/src/mod_tlsraw.c @EXT@/BearSSL/src/*/*.c @EXT@/BearSSL/src/settings.c -I@EXT@/BearSSL/inc -I@EXT@/BearSSL/src
vlr.tls lua:@VLR@/lua/tls.lua
vlr.cacerts lua:@VLR@/lua/cacerts.lua
socket lua:@VLR@/lua/socket.lua
vlr.luaheaders lua:@VLR@/lua/luaheaders.lua
ltn12 lua:@VLR@/lua/ltn12.lua
mime lua:@VLR@/lua/mime.lua
socket.url lua:@VLR@/lua/socket_url.lua
socket.http lua:@VLR@/lua/socket_http.lua
ssl lua:@VLR@/lua/ssl.lua
ssl.https lua:@VLR@/lua/ssl_https.lua
# ed25519 verification for vpm's signed index: the `ed25519` rock (sibling checkout, vendors Monocypher)
ed25519 luaopen_ed25519 @EXT@/ed25519/ed25519.c @EXT@/ed25519/monocypher.c @EXT@/ed25519/monocypher-ed25519.c -I@EXT@/ed25519
# third-party C modules
lfs   luaopen_lfs   @EXT@/luafilesystem/src/lfs.c
lpeg  luaopen_lpeg  @EXT@/lpeg-1.1.0/lpcap.c @EXT@/lpeg-1.1.0/lpcode.c @EXT@/lpeg-1.1.0/lpcset.c @EXT@/lpeg-1.1.0/lpprint.c @EXT@/lpeg-1.1.0/lptree.c @EXT@/lpeg-1.1.0/lpvm.c
cjson luaopen_cjson @EXT@/lua-cjson/lua_cjson.c @EXT@/lua-cjson/strbuf.c @EXT@/lua-cjson/fpconv.c
cjson.safe luaopen_cjson_safe @EXT@/lua-cjson/lua_cjson.c @EXT@/lua-cjson/strbuf.c @EXT@/lua-cjson/fpconv.c
bit lua:@VLR@/lua/bit.lua
bit32 lua:@VLR@/lua/bit32.lua
